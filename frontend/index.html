
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10131c">
<title>Nova AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #10131c;
  color: #f4f5f8;
}

button, input { font: inherit; }

button {
  cursor: pointer;
  border: 0;
}

.hidden { display: none !important; }

#authScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.auth-box {
  width: 100%;
  max-width: 380px;
  background: #1a1f2b;
  padding: 28px;
  border-radius: 18px;
}

.logo {
  font-size: 32px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #9da6b8;
  margin-bottom: 25px;
}

.auth-box input {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border-radius: 9px;
  border: 1px solid #343b4b;
  background: #101522;
  color: white;
  outline: none;
}

.primary {
  background: #7865ed;
  color: white;
  padding: 13px;
  border-radius: 9px;
  width: 100%;
  margin-top: 12px;
  font-weight: bold;
}

.switch {
  color: #a99cff;
  text-align: center;
  margin-top: 18px;
  cursor: pointer;
}

#appScreen {
  height: 100dvh;
  display: flex;
  overflow: hidden;
}

#sidebar {
  width: 270px;
  flex-shrink: 0;
  background: #171c27;
  border-right: 1px solid #293142;
  display: flex;
  flex-direction: column;
  padding: 15px;
}

.side-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.side-logo {
  font-size: 23px;
  font-weight: bold;
}

.new-chat {
  width: 100%;
  padding: 12px;
  border-radius: 9px;
  background: #7865ed;
  color: white;
  font-weight: bold;
  margin-bottom: 18px;
}

.section-label {
  color: #8993a6;
  font-size: 12px;
  margin-bottom: 10px;
}

#conversationList {
  overflow-y: auto;
  flex: 1;
}

.conversation {
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 5px;
  cursor: pointer;
  color: #cbd1dc;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.conversation:hover,
.conversation.active {
  background: #293044;
  color: white;
}

.account {
  border-top: 1px solid #293142;
  padding-top: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}

.logout {
  background: #30394b;
  color: white;
  padding: 8px 11px;
  border-radius: 7px;
}

#main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

header {
  height: 60px;
  flex-shrink: 0;
  border-bottom: 1px solid #293142;
  display: flex;
  align-items: center;
  padding: 0 18px;
  gap: 12px;
}

header strong { font-size: 18px; }

#menuButton {
  display: none;
  background: #293044;
  color: white;
  border-radius: 7px;
  padding: 8px 11px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 22px 16px;
}

.welcome {
  text-align: center;
  margin: 15vh auto 0;
  max-width: 420px;
}

.welcome h1 {
  font-size: 34px;
  margin-bottom: 8px;
}

.welcome p { color: #9da6b8; }

.message {
  max-width: 760px;
  margin: 0 auto 22px;
  display: flex;
  gap: 12px;
  line-height: 1.6;
}

.avatar {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #7865ed;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.message.user .avatar { background: #34445b; }

.message-content {
  min-width: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  padding-top: 5px;
}

.message-name {
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 5px;
  color: #a99cff;
}

.message.user .message-name { color: #aabbd5; }

#composer {
  padding: 14px 16px 18px;
  border-top: 1px solid #293142;
}

.composer-inner {
  max-width: 760px;
  margin: auto;
  display: flex;
  gap: 10px;
  background: #1b2230;
  border: 1px solid #343d50;
  border-radius: 14px;
  padding: 8px;
}

#messageInput {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 0;
  outline: none;
  color: white;
  padding: 10px;
  resize: none;
}

#sendButton {
  background: #7865ed;
  color: white;
  padding: 0 18px;
  border-radius: 9px;
  font-weight: bold;
}

#sendButton:disabled { opacity: .5; }

#status {
  color: #9da6b8;
  font-size: 12px;
  text-align: center;
  margin-top: 8px;
}

@media (max-width: 650px) {
  #sidebar {
    position: fixed;
    z-index: 5;
    top: 0;
    bottom: 0;
    left: 0;
    transform: translateX(-100%);
    transition: transform .2s;
  }

  #sidebar.open { transform: translateX(0); }

  #menuButton { display: block; }

  header { padding: 0 12px; }

  #chat { padding: 18px 12px; }

  #composer { padding: 10px; }
}
</style>
</head>

<body>

<section id="authScreen">
  <div class="auth-box">
    <div class="logo">Nova AI</div>
    <div class="subtitle" id="authSubtitle">Your personal AI assistant</div>

    <form id="authForm">
      <input id="username" placeholder="Username" required autocomplete="username">
      <input id="password" type="password" placeholder="Password" required autocomplete="current-password">
      <button class="primary" id="authButton" type="submit">Login</button>
    </form>

    <div class="switch" id="switchAuth">Create an account</div>
    <p id="authError" style="color:#ff8585;text-align:center"></p>
  </div>
</section>

<section id="appScreen" class="hidden">

  <aside id="sidebar">
    <div class="side-top">
      <div class="side-logo">Nova AI</div>
      <button id="closeSidebar" class="logout">✕</button>
    </div>

    <button class="new-chat" id="newChatButton">＋ New Chat</button>

    <div class="section-label">YOUR CONVERSATIONS</div>
    <div id="conversationList"></div>

    <div class="account">
      <span id="accountName">Account</span>
      <button class="logout" id="logoutButton">Logout</button>
    </div>
  </aside>

  <main id="main">
    <header>
      <button id="menuButton">☰</button>
      <strong>Nova</strong>
      <span style="color:#8993a6;font-size:12px">Personal AI assistant</span>
    </header>

    <div id="chat">
      <div class="welcome" id="welcome">
        <h1>Hello 👋</h1>
        <p>I'm Nova. What would you like to talk about?</p>
      </div>
      <div id="messages"></div>
    </div>

    <div id="composer">
      <div class="composer-inner">
        <input id="messageInput" placeholder="Message Nova..." autocomplete="off">
        <button id="sendButton">Send</button>
      </div>
      <div id="status">Nova is ready</div>
    </div>
  </main>
</section>

<script>
const API = "";

let isRegister = false;
let currentConversationId = null;
let busy = false;

const $ = id => document.getElementById(id);

async function request(path, options = {}) {
  const response = await fetch(API + path, {
    credentials: "same-origin",
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(data.error || data.message || "Request failed");
  }

  return data;
}

function showAuth() {
  $("authScreen").classList.remove("hidden");
  $("appScreen").classList.add("hidden");
}

function showApp(username) {
  $("authScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
  $("accountName").textContent = username || "Account";
}

function authMode(register) {
  isRegister = register;
  $("authButton").textContent = register ? "Create Account" : "Login";
  $("authSubtitle").textContent = register
    ? "Create your Nova account"
    : "Your personal AI assistant";
  $("switchAuth").textContent = register
    ? "Already have an account? Login"
    : "Create an account";
  $("authError").textContent = "";
}

$("switchAuth").onclick = () => authMode(!isRegister);

$("authForm").onsubmit = async event => {
  event.preventDefault();

  $("authError").textContent = "Please wait...";

  try {
    const data = await request(isRegister ? "/register" : "/login", {
      method: "POST",
      body: JSON.stringify({
        username: $("username").value.trim(),
        password: $("password").value
      })
    });

    showApp(data.username || $("username").value.trim());
    await loadConversations();
  } catch (error) {
    $("authError").textContent = error.message;
  }
};

async function checkLogin() {
  try {
    const data = await request("/me");

    if (data.authenticated || data.username) {
      showApp(data.username || "Account");
      await loadConversations();
    } else {
      showAuth();
    }
  } catch {
    showAuth();
  }
}

async function loadConversations() {
  const data = await request("/conversations");
  const conversations = data.conversations || data.items || [];

  $("conversationList").innerHTML = "";

  conversations.forEach(conversation => {
    const item = document.createElement("div");
    item.className = "conversation";

    if (conversation.id === currentConversationId) {
      item.classList.add("active");
    }

    item.textContent = conversation.title || "New Chat";
    item.onclick = () => openConversation(conversation.id);

    $("conversationList").appendChild(item);
  });

  if (!currentConversationId && conversations.length) {
    await openConversation(conversations[0].id);
  } else if (!currentConversationId) {
    await createNewChat();
  }
}

async function createNewChat() {
  try {
    const data = await request("/new-chat", {
      method: "POST",
      body: JSON.stringify({})
    });

    currentConversationId =
      data.conversation_id || data.id;

    if (!currentConversationId) {
      throw new Error("No conversation ID returned");
    }

    $("messages").innerHTML = "";
    $("welcome").classList.remove("hidden");
    $("status").textContent = "New chat ready";

    await loadConversationListOnly();
    closeSidebar();
  } catch (error) {
    $("status").textContent = error.message;
  }
}

async function loadConversationListOnly() {
  const data = await request("/conversations");
  const conversations = data.conversations || data.items || [];

  $("conversationList").innerHTML = "";

  conversations.forEach(conversation => {
    const item = document.createElement("div");
    item.className = "conversation";

    if (conversation.id === currentConversationId) {
      item.classList.add("active");
    }

    item.textContent = conversation.title || "New Chat";
    item.onclick = () => openConversation(conversation.id);

    $("conversationList").appendChild(item);
  });
}

async function openConversation(id) {
  try {
    currentConversationId = id;
    $("messages").innerHTML = "";
    $("welcome").classList.add("hidden");
    $("status").textContent = "Loading conversation...";

    const data = await request(
      "/history?conversation_id=" + encodeURIComponent(id)
    );

    const messages = data.messages || [];

    messages.forEach(message => {
      addMessage(message.role, message.content);
    });

    $("welcome").classList.toggle("hidden", messages.length > 0);
    $("status").textContent = "Nova is ready";

    await loadConversationListOnly();
    closeSidebar();
  } catch (error) {
    $("status").textContent = error.message;
  }
}

function addMessage(role, content) {
  $("welcome").classList.add("hidden");

  const row = document.createElement("div");
  row.className = "message " + (role === "user" ? "user" : "assistant");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "Y" : "N";

  const body = document.createElement("div");
  body.className = "message-content";

  const name = document.createElement("div");
  name.className = "message-name";
  name.textContent = role === "user" ? "You" : "Nova";

  const text = document.createElement("div");
  text.textContent = content || "";

  body.appendChild(name);
  body.appendChild(text);
  row.appendChild(avatar);
  row.appendChild(body);

  $("messages").appendChild(row);
  $("chat").scrollTop = $("chat").scrollHeight;
}

async function sendMessage() {
  const message = $("messageInput").value.trim();

  if (!message || busy) return;

  if (!currentConversationId) {
    await createNewChat();
    if (!currentConversationId) return;
  }

  busy = true;
  $("sendButton").disabled = true;
  $("messageInput").value = "";

  addMessage("user", message);
  $("status").textContent = "Nova is thinking...";

  try {
    const data = await request("/chat", {
      method: "POST",
      body: JSON.stringify({
        message,
        conversation_id: currentConversationId
      })
    });

    const reply = data.reply || data.response || data.message;

    if (!reply) {
      throw new Error("Nova returned an empty response");
    }

    if (data.conversation_id) {
      currentConversationId = data.conversation_id;
    }

    addMessage("assistant", reply);
    $("status").textContent = "Nova is ready";

    await loadConversationListOnly();
  } catch (error) {
    addMessage("assistant", "Error: " + error.message);
    $("status").textContent = "Something went wrong";
  } finally {
    busy = false;
    $("sendButton").disabled = false;
    $("messageInput").focus();
  }
}

$("sendButton").onclick = sendMessage;

$("messageInput").onkeydown = event => {
  if (event.key === "Enter") {
    event.preventDefault();
    sendMessage();
  }
};

$("newChatButton").onclick = createNewChat;

$("logoutButton").onclick = async () => {
  try {
    await request("/logout", {
      method: "POST",
      body: JSON.stringify({})
    });
  } catch {}

  currentConversationId = null;
  $("messages").innerHTML = "";
  showAuth();
};

$("menuButton").onclick = () => {
  $("sidebar").classList.add("open");
};

$("closeSidebar").onclick = closeSidebar;

function closeSidebar() {
  $("sidebar").classList.remove("open");
}

checkLogin();
</script>

</body>
</html>
