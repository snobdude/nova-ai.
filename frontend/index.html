
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#10131c">
<title>Nova AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#10131c;
  color:#fff;
}

button,input{font:inherit}
button{border:0;cursor:pointer}
.hidden{display:none!important}

header{
  height:60px;
  display:flex;
  align-items:center;
  padding:0 15px;
  background:#171b26;
  border-bottom:1px solid #292f3d;
}

#menuButton{
  background:none;
  color:#fff;
  font-size:25px;
  margin-right:12px;
}

.logo{font-size:20px;font-weight:bold}

#sidebar{
  position:fixed;
  top:0;
  left:-290px;
  width:290px;
  height:100%;
  background:#171b26;
  z-index:10;
  transition:.25s;
  border-right:1px solid #292f3d;
  padding:15px;
  overflow-y:auto;
}

#sidebar.open{left:0}

#sidebarTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

#closeSidebar{
  background:none;
  color:#fff;
  font-size:25px;
}

#newChat{
  width:100%;
  padding:12px;
  border-radius:9px;
  background:#30394b;
  color:#fff;
  margin-bottom:15px;
}

.conversation{
  padding:12px;
  margin-bottom:6px;
  border-radius:8px;
  cursor:pointer;
  background:#202633;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.conversation.active{background:#35415a}

#logoutButton{
  width:100%;
  margin-top:15px;
  padding:11px;
  border-radius:8px;
  background:#8b3030;
  color:white;
}

main{
  height:calc(100vh - 60px);
  display:flex;
  flex-direction:column;
}

#messages{
  flex:1;
  overflow-y:auto;
  padding:20px 15px 110px;
}

#welcome{
  max-width:600px;
  margin:70px auto;
  text-align:center;
  color:#b9c0ce;
}

#welcome h1{color:#fff}

.message{
  max-width:850px;
  margin:0 auto 15px;
  display:flex;
}

.message.user{justify-content:flex-end}
.message.assistant{justify-content:flex-start}

.bubble{
  max-width:85%;
  padding:12px 15px;
  border-radius:14px;
  line-height:1.5;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.user .bubble{background:#34425d}
.assistant .bubble{background:#202633}

#composer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#171b26;
  border-top:1px solid #292f3d;
  padding:10px;
}

.composer-inner{
  max-width:900px;
  margin:auto;
  display:flex;
  gap:7px;
}

#messageInput{
  flex:1;
  min-width:0;
  padding:13px;
  border-radius:9px;
  border:1px solid #343c4d;
  background:#10131c;
  color:white;
  outline:none;
}

#messageInput:focus{border-color:#596a8d}

#voiceButton,#sendButton{
  padding:0 15px;
  border-radius:9px;
  color:white;
}

#voiceButton{
  background:#30394b;
  font-size:19px;
}

#voiceButton.listening{background:#c83d3d}
#voiceButton:disabled{opacity:.5;cursor:not-allowed}
#sendButton{background:#536b9b}
#sendButton:disabled{opacity:.5}

#status{
  max-width:900px;
  margin:6px auto 0;
  font-size:12px;
  color:#8f98aa;
}

@media(max-width:600px){
  .bubble{max-width:90%}
  #messages{padding-left:10px;padding-right:10px}
  #voiceButton,#sendButton{padding:0 12px}
}
</style>
</head>

<body>

<header>
  <button id="menuButton">☰</button>
  <div class="logo">Nova</div>
</header>

<aside id="sidebar">
  <div id="sidebarTop">
    <strong>Chats</strong>
    <button id="closeSidebar">×</button>
  </div>

  <button id="newChat">＋ New Chat</button>
  <div id="conversationList"></div>
  <button id="logoutButton">Logout</button>
</aside>

<main>
  <div id="messages">
    <div id="welcome">
      <h1>Nova</h1>
      <p>Your personal AI assistant.</p>
    </div>
  </div>

  <div id="composer">
    <div class="composer-inner">
      <input id="messageInput"
        placeholder="Message Nova..."
        autocomplete="off">

      <button id="voiceButton"
        type="button"
        title="Speak">🎙️</button>

      <button id="sendButton">Send</button>
    </div>

    <div id="status">Nova is ready</div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);

let currentConversationId = null;
let busy = false;

/* API */

async function request(url, options = {}) {
  const response = await fetch(url, {
    credentials: "include",
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(
      data.error || data.message || "Request failed"
    );
  }

  return data;
}

/* AUTH */

async function checkLogin() {
  try {
    await request("/me");
    await loadConversations();
  } catch {
    location.href = "/";
  }
}

/* CONVERSATIONS */

async function loadConversations() {
  try {
    const data = await request("/conversations");
    const list = $("conversationList");

    list.innerHTML = "";

    (data.conversations || []).forEach(conversation => {
      const item = document.createElement("div");

      item.className = "conversation";

      if (conversation.id === currentConversationId) {
        item.classList.add("active");
      }

      item.textContent = conversation.title || "New Chat";

      item.onclick = () => openConversation(conversation.id);

      list.appendChild(item);
    });
  } catch(error) {
    $("status").textContent = error.message;
  }
}

async function createNewChat() {
  try {
    stopNovaSpeech();

    const data = await request("/new-chat", {
      method: "POST"
    });

    currentConversationId = data.conversation_id;

    $("messages").innerHTML = `
      <div id="welcome">
        <h1>Nova</h1>
        <p>Your personal AI assistant.</p>
      </div>
    `;

    await loadConversations();
    closeSidebar();

    $("status").textContent = "New chat ready";
  } catch(error) {
    $("status").textContent = error.message;
  }
}

async function openConversation(id) {
  try {
    stopNovaSpeech();

    currentConversationId = id;
    $("messages").innerHTML = "";
    $("status").textContent = "Loading conversation...";

    const data = await request(
      "/history?conversation_id=" + encodeURIComponent(id)
    );

    const messages = data.messages || [];

    if (messages.length === 0) {
      $("messages").innerHTML = `
        <div id="welcome">
          <h1>Nova</h1>
          <p>No messages in this conversation yet.</p>
        </div>
      `;
    } else {
      messages.forEach(message => {
        addMessage(message.role, message.content);
      });
    }

    $("status").textContent = "Nova is ready";

    await loadConversations();
    closeSidebar();
    scrollToBottom();
  } catch(error) {
    $("status").textContent = error.message;
  }
}

/* MESSAGES */

function addMessage(role, content) {
  const messages = $("messages");

  const row = document.createElement("div");

  row.className =
    "message " + (role === "user" ? "user" : "assistant");

  const bubble = document.createElement("div");

  bubble.className = "bubble";
  bubble.textContent = content;

  row.appendChild(bubble);
  messages.appendChild(row);
}

function scrollToBottom() {
  const messages = $("messages");
  messages.scrollTop = messages.scrollHeight;
}

/* VOICE OUTPUT */

function stopNovaSpeech() {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
}

function speakNova(text) {
  if (!("speechSynthesis" in window)) {
    $("status").textContent =
      "Voice output is not supported on this device";
    return;
  }

  const cleanText = String(text || "").trim();

  if (!cleanText) return;

  stopNovaSpeech();

  const utterance = new SpeechSynthesisUtterance(cleanText);

  utterance.lang = "en-US";
  utterance.rate = 1;
  utterance.pitch = 1;
  utterance.volume = 1;

  utterance.onstart = () => {
    $("status").textContent = "Nova is speaking...";
  };

  utterance.onend = () => {
    if (!busy) {
      $("status").textContent = "Nova is ready";
    }
  };

  utterance.onerror = () => {
    if (!busy) {
      $("status").textContent = "Voice playback failed";
    }
  };

  window.speechSynthesis.speak(utterance);
}

/* SEND MESSAGE */

async function sendMessage() {
  if (busy) return;

  const input = $("messageInput");
  const message = input.value.trim();

  if (!message) return;

  busy = true;
  input.value = "";

  addMessage("user", message);
  scrollToBottom();

  $("sendButton").disabled = true;
  $("status").textContent = "Nova is thinking...";

  try {
    const data = await request("/chat", {
      method: "POST",
      body: JSON.stringify({
        message,
        conversation_id: currentConversationId
      })
    });

    if (data.conversation_id) {
      currentConversationId = data.conversation_id;
    }

    const reply = data.reply || "";

    addMessage("assistant", reply);

    await loadConversations();
    scrollToBottom();

    // Automatically speak Nova's reply
    if (reply.trim()) {
      speakNova(reply);
    } else {
      $("status").textContent = "Nova is ready";
    }

  } catch(error) {
    addMessage("assistant", "Error: " + error.message);
    $("status").textContent = "Error";
  } finally {
    busy = false;
    $("sendButton").disabled = false;
    input.focus();
  }
}

/* VOICE INPUT */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

const voiceButton = $("voiceButton");

if (SpeechRecognition) {
  const recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.interimResults = false;
  recognition.continuous = false;

  let listening = false;

  recognition.onstart = () => {
    listening = true;
    voiceButton.classList.add("listening");
    voiceButton.textContent = "🔴";
    $("status").textContent = "Listening...";
  };

  recognition.onresult = event => {
    const transcript = event.results[0][0].transcript;
    $("messageInput").value = transcript;
    $("status").textContent = "Voice captured";
  };

  recognition.onerror = event => {
    $("status").textContent = "Voice error: " + event.error;
  };

  recognition.onend = () => {
    listening = false;
    voiceButton.classList.remove("listening");
    voiceButton.textContent = "🎙️";

    if (!busy) {
      $("status").textContent = "Nova is ready";
    }
  };

  voiceButton.onclick = () => {
    if (listening) return;

    try {
      recognition.start();
    } catch(error) {
      console.log(error);
    }
  };
} else {
  voiceButton.disabled = true;
  voiceButton.title =
    "Voice input is not supported in this browser";
}

/* BUTTONS */

$("sendButton").onclick = sendMessage;

$("messageInput").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

$("menuButton").onclick = () => {
  $("sidebar").classList.add("open");
};

$("closeSidebar").onclick = closeSidebar;

function closeSidebar() {
  $("sidebar").classList.remove("open");
}

$("newChat").onclick = createNewChat;

$("logoutButton").onclick = async () => {
  try {
    stopNovaSpeech();

    await request("/logout", {
      method: "POST"
    });

    location.href = "/";
  } catch(error) {
    $("status").textContent = error.message;
  }
};

/* START */

checkLogin();
</script>

</body>
</html>
